# Configuração do Streamlit para a interface simples (lida a partir da raiz do projeto).

[server]
# Só este computador acede à app: o ML Lab é local e não tem autenticação.
# Para abrir a outros dispositivos da rede, troca por "0.0.0.0" (com cuidado).
address = "localhost"

[browser]
# Não enviar estatísticas de utilização para a Streamlit.
gatherUsageStats = false
