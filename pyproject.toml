[project]
name = "ml-lab"
version = "0.1.0"
description = "Laboratório de machine learning para aprender: treino passo a passo, métricas e registo de experiências."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simão" }]
# As bibliotecas de dados e ML entram fase a fase (ver docs/architecture.md, secção Roadmap):
# fase 1: numpy, pandas (+ openpyxl para Excel) · fase 2: scikit-learn, pydantic
# fase 5: joblib (já vinha com o scikit-learn) · fase 6: torch · fase 7: fastapi
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "threadpoolctl>=3.7.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# Ferramentas de desenvolvimento: estilo, tipos e testes.
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# `uv sync` instala tudo o que é preciso para desenvolver o backend, num só comando. A
# interface (ui/web) instala-se à parte, com o npm.
default-groups = ["dev"]

# --- ruff: linter e formatador -------------------------------------------------
[tool.ruff]
line-length = 100
# Pastas com código próprio: o isort trata os seus módulos como "first-party".
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: erros de estilo
    "W",   # pycodestyle: avisos de estilo
    "F",   # Pyflakes: nomes por definir, imports não usados
    "I",   # isort: ordem dos imports
    "N",   # pep8-naming: convenções de nomes
    "D",   # pydocstyle: docstrings no estilo Google
    "UP",  # pyupgrade: sintaxe moderna de Python 3.12
    "B",   # flake8-bugbear: armadilhas comuns
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie: código desnecessário
    "PTH", # flake8-use-pathlib: pathlib em vez de os.path
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports: só imports absolutos
    "G",   # flake8-logging-format: formatação preguiçosa nos logs
    "LOG", # flake8-logging: boas práticas do módulo logging
    "T20", # flake8-print: sem print() no código (usa logging)
    "NPY", # regras do NumPy (ex.: geradores aleatórios modernos)
    "RUF", # regras próprias do ruff
]
ignore = [
    "D105", # métodos mágicos (__len__, __repr__...) dispensam docstring
    "D107", # os argumentos de __init__ documentam-se na docstring da classe
]

# O sinal de multiplicação aparece nas dimensões das tabelas ("891 × 12"), o sinal de menos
# tipográfico nas fórmulas dos eixos ("real − previsto") e as letras gregas nos nomes dos
# hiperparâmetros do reinforcement learning ("Desconto (γ)", "taxa α", "ε-greedy"), de propósito.
allowed-confusables = ["×", "−", "α", "γ", "ε"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# Em ML, X é o nome habitual da matriz de features (e y o do alvo).
ignore-names = ["X", "X_*"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Nos testes, o nome da função é a documentação.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy: verificação estática de tipos ---------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "scripts"]
# src/ é a raiz do pacote ml_lab.
mypy_path = ["src"]
explicit_package_bases = true
pretty = true
# O plugin do Pydantic ensina o mypy a ler os modelos (campos, valores por omissão, Field).
plugins = ["pydantic.mypy"]

# O scikit-learn, o joblib, o threadpoolctl, o skl2onnx e o ONNX Runtime não trazem anotações
# de tipos: os seus objetos ficam com o tipo Any.
[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
    "threadpoolctl",
    "skl2onnx",
    "skl2onnx.*",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

# --- pytest: testes ---------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
markers = [
    "integration: fluxo completo de ponta a ponta; corre antes de cada push",
    "api: endpoints HTTP e WebSocket (a partir da fase 7); corre antes de cada push",
]
