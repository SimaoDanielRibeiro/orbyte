# As verificações de cada push: as mesmas que se correm à mão antes de um push (README.md,
# "Testes e verificações"). O backend e a interface correm sempre; os testes de ponta a ponta
# (a interface num browser, com a API a sério) demoram mais, por isso correm no main e à mão.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo ramo cancela a corrida anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # As versões exatas do uv.lock; o Python (3.12, do .python-version) vem com o uv.
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Todos os testes; os do Ollama saltam-se sozinhos, porque ele não está a correr aqui.
      - run: uv run pytest

  interface:
    name: Interface (formato, lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      # Gera o cliente a partir do openapi.json e corre o lint, os tipos e os testes.
      - run: npm run check
      - run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    if: github.event_name != 'pull_request'
    needs: [backend, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - run: npx playwright install --with-deps chromium
        working-directory: ui/web
      # A configuração arranca a API (porta 8001, numa pasta temporária) e o build da interface.
      - run: npm run e2e
        working-directory: ui/web
      - name: Guardar o relatório, se algum teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/web/playwright-report/
            ui/web/test-results/
          retention-days: 7
