# As verificações de cada push: as mesmas que se correm à mão antes de um push (README.md,
# "Testes e verificações"). O backend e a interface correm sempre; os testes de ponta a ponta
# (a interface num browser, com a API a sério) demoram mais, por isso correm no main e à mão, e
# os do Windows e do macOS também (ver o job "other-systems").

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo ramo cancela a corrida anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # As versões exatas do uv.lock; o Python (3.12, do .python-version) vem com o uv.
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Todos os testes; os do Ollama saltam-se sozinhos, porque ele não está a correr aqui.
      - run: uv run pytest

  interface:
    name: Interface (formato, lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      # Gera o cliente a partir do openapi.json e corre o lint, os tipos e os testes.
      - run: npm run check
      - run: npm run build

  # Os computadores de quem descarrega o projeto (ADR 0054): no Windows e no macOS (Apple
  # Silicon), o backend e a interface instalam-se das versões fixadas e passam os testes rápidos.
  # O Linux já é o dos outros jobs. Corre a cada push no main com o repositório público (os
  # minutos são grátis) e sempre à mão; num repositório privado, só à mão, porque cada minuto do
  # macOS conta por dez.
  other-systems:
    name: Outros sistemas (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !github.event.repository.private)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration and not api"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - run: npm run check
        working-directory: ui/web
      - run: npm run build
        working-directory: ui/web

  e2e:
    name: Ponta a ponta (Playwright)
    if: github.event_name != 'pull_request'
    needs: [backend, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - run: npx playwright install --with-deps chromium
        working-directory: ui/web
      # A configuração arranca a API (porta 8001, numa pasta temporária) e o build da interface.
      - run: npm run e2e
        working-directory: ui/web
      - name: Guardar o relatório, se algum teste falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/web/playwright-report/
            ui/web/test-results/
          retention-days: 7
